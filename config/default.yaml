# ============================================================================
# config/default.yaml
# ============================================================================
models:
  prover:
    name: "openai/gpt-oss-20b"
  evaluators:
    use_multi_judge: true
    per_judge_timeout: 600
    models:
      - "openai/gpt-oss-120b"
      - "meta/llama-3.1-70b-instruct"
      - "sarvamai/sarvam-m"

workflow:
  max_iterations: 3
  min_crs_threshold: 0.6

# Per-phase temperatures (see src/config/temperatures.py for rationale)
temperatures:
  generation: 0.7      # Prover: initial proof (creative)
  correction: 0.4      # Prover: correction iterations (targeted)
  evaluation: 0.05     # Judge: initial evaluation (deterministic JSON)
  verification: 0.05   # Judge: re-evaluation after correction (deterministic JSON)

metrics:
  correction:
    # CRS formula: CRS = (w_err*ERR + w_tfp*TFP) * (1 - w_rp_pen*RP)
    # Max achievable = 1.0 (ERR=1, TFP=1, RP=0)
    w_err: 0.60
    w_tfp: 0.40
    w_rp_pen: 0.20

  judge_reliability:
    alpha: 0.6          # Weight for ESA (agreement)
    beta: 0.4           # Weight for z-score penalty
    outlier_threshold: 2.0

logging:
  level: "INFO"
  log_dir: "logs"
  save_proofs: true
  save_intermediate_states: true